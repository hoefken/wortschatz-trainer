<div class="bar">
  <span class="title">Wortschatz-Trainer</span>
  <mat-chip-set aria-label="Sprachpaar">
    <mat-chip>Deutsch ⇄ Englisch</mat-chip>
  </mat-chip-set>
</div>
<nav mat-tab-nav-bar [tabPanel]="tabPanel()" mat-stretch-tabs="false" aria-label="Bereiche">
  @for (section of sections; track section.path) {
    <a
      mat-tab-link
      [routerLink]="section.path"
      routerLinkActive
      #link="routerLinkActive"
      [active]="link.isActive"
    >
      {{ section.label }}
    </a>
  }
</nav>
