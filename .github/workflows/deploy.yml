name: Deploy

on:
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
      - run: npm ci
      - run: npm run build -- --base-href /${{ github.event.repository.name }}/
      - name: Add SPA fallback and licenses
        working-directory: dist/wortschatz-trainer
        run: |
          cp browser/index.html browser/404.html
          cp 3rdpartylicenses.txt browser/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/wortschatz-trainer/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
